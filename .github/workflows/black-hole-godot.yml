name: Godot validate and screenshot

on:
  push:
    branches:
      - feat/black-hole-flyby-godot
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download Godot 4.4.1
        run: |
          curl --fail --location --retry 3 --output godot.zip https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.4.1-stable_linux.x86_64
      - name: Import and compile
        run: ./Godot_v4.4.1-stable_linux.x86_64 --headless --path black-hole-flyby --editor --quit
      - name: Physical model tests
        run: ./Godot_v4.4.1-stable_linux.x86_64 --headless --path black-hole-flyby --script res://tests/physics_test.gd
      - name: Capture actual Godot screenshots
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
          timeout 90s xvfb-run -a ./Godot_v4.4.1-stable_linux.x86_64 --rendering-driver opengl3 --path black-hole-flyby -- --capture-dir="${GITHUB_WORKSPACE}/black-hole-flyby/screenshots"
      - name: Commit verified runtime captures
        if: github.event_name == 'push'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add black-hole-flyby/screenshots/0[1-4]_*.png
          if ! git diff --cached --quiet; then
            git commit -m "docs: add actual Godot runtime screenshots"
            git push
          fi
      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: godot-runtime-screenshots
          path: black-hole-flyby/screenshots/0[1-4]_*.png
          if-no-files-found: error
