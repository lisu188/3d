name: Godot validate and screenshot

on:
  push:
    branches:
      - feat/black-hole-flyby-godot
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download Godot 4.4.1
        run: |
          curl --fail --location --retry 3 --output godot.zip https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.4.1-stable_linux.x86_64
      - name: Install scientific orbit integrator
        run: python3 -m pip install --quiet numpy scipy
      - name: Integrate NASA/JPL orbital initial states
        run: |
          python3 black-hole-flyby/scripts/generate_orbits.py --initial horizons --epoch '2026-10-23 00:00' --output black-hole-flyby/data/four_body.csv --reference-validation
      - name: Import and compile
        run: ./Godot_v4.4.1-stable_linux.x86_64 --headless --path black-hole-flyby --editor --quit
      - name: Physical model tests
        run: ./Godot_v4.4.1-stable_linux.x86_64 --headless --path black-hole-flyby --script res://tests/physics_test.gd
      - name: Test orbital data and numerical drift
        run: ./Godot_v4.4.1-stable_linux.x86_64 --headless --path black-hole-flyby --script res://tests/orbit_data_test.gd
      - name: Capture actual Godot screenshots
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri ffmpeg
          timeout 90s xvfb-run -a ./Godot_v4.4.1-stable_linux.x86_64 --rendering-driver opengl3 --path black-hole-flyby -- --capture-dir="${GITHUB_WORKSPACE}/black-hole-flyby/screenshots"
      - name: Render full orbital flyby film in Godot
        if: github.actor != 'github-actions[bot]'
        run: |
          mkdir -p black-hole-flyby/video
          timeout 1800s xvfb-run -a ./Godot_v4.4.1-stable_linux.x86_64 --rendering-driver opengl3 --disable-vsync --path black-hole-flyby --write-movie video/orbital-flyby.avi --fixed-fps 15 --quit-after 1200
          ffmpeg -hide_banner -loglevel error -y -i black-hole-flyby/video/orbital-flyby.avi -c:v libx264 -preset veryfast -crf 24 -pix_fmt yuv420p -movflags +faststart black-hole-flyby/video/black-hole-flyby.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 black-hole-flyby/video/black-hole-flyby.mp4
      - name: Upload complete MP4 movie
        if: github.actor != 'github-actions[bot]'
        uses: actions/upload-artifact@v4
        with:
          name: black-hole-flyby-orbit-mp4
          path: black-hole-flyby/video/black-hole-flyby.mp4
          if-no-files-found: error
      - name: Commit verified runtime captures
        if: github.event_name == 'push'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add black-hole-flyby/screenshots/0[1-4]_*.png black-hole-flyby/data/four_body.csv black-hole-flyby/data/four_body.json
          if ! git diff --cached --quiet; then
            git commit -m "docs: add actual Godot runtime screenshots"
            git push
          fi
      - name: Upload scientific trajectory and diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: four-body-solution-and-diagnostics
          path: |
            black-hole-flyby/data/four_body.csv
            black-hole-flyby/data/four_body.json
          if-no-files-found: error
      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: godot-runtime-screenshots
          path: black-hole-flyby/screenshots/0[1-4]_*.png
          if-no-files-found: error
